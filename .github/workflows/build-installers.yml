name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/ClickShow.csproj
          $version = $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must be v$version" }
      - name: Test logic
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Build installers
        shell: pwsh
        run: ./scripts/Build.ps1 -Edition Both
      - name: Verify installers
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem artifacts/installers -Filter '*.exe' -File)
          if ($installers.Count -ne 2) { throw "Expected two installers, found $($installers.Count)" }
      - uses: actions/upload-artifact@v7
        with:
          name: ClickShow-installers
          path: artifacts/installers/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ClickShow-installers
          path: artifacts/installers
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $installers = @(Get-ChildItem artifacts/installers -Filter '*.exe' -File | ForEach-Object FullName)
          if ($installers.Count -ne 2) { throw "Expected two installers, found $($installers.Count)" }
          gh release create $env:GITHUB_REF_NAME $installers --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
          if ($LASTEXITCODE) { throw 'Release 发布失败' }
